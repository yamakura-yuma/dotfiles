name: pstack-claude
version: 0.1.0
description: pstack (poteto-mode) from cursor/plugins, run on Claude Code — upstream skills as-is, one overlay skill that maps Cursor's tools onto Claude Code and Orca, and the coordinator edit guard
author: yyamakura
targets:
- claude
- codex
- copilot
# An alternative to ../core-principal, not an addition to it. A consumer
# depends on one or the other; depending on both mixes two harnesses and
# defeats comparing them.
#
# The point of this package is that upstream does the work. Nothing from
# pstack is copied or edited here: every Cursor-specific name is translated at
# read time by the pstack-on-claude-code skill, so bumping `ref` is the whole
# upgrade. Keep that overlay thin -- a line that grows into a rewrite of a
# playbook is a sign the playbook should be dropped, not patched.
dependencies:
  apm:
  # --- pstack -----------------------------------------------------------------
  # MIT, Lauren Tan. apm reads pstack/.cursor-plugin/plugin.json and deploys
  # its skills/ and agents/ (poteto-agent, comment-sicko). Upstream publishes
  # no tags, so pin the commit.
  - git: https://github.com/cursor/plugins.git
    path: pstack
    ref: ecc249f1e306fc64ddf83c7bed16cacf7c2239db
    alias: pstack
    targets:
    - claude
    - codex
    - copilot

  # poteto-mode calls these three by name from Cursor's cursor-team-kit plugin.
  # Their text is plain local tooling with no Cursor dependency, so they are
  # taken from the same commit rather than substituted.
  - git: https://github.com/cursor/plugins.git
    path: cursor-team-kit/skills/deslop
    ref: ecc249f1e306fc64ddf83c7bed16cacf7c2239db
    alias: deslop
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/cursor/plugins.git
    path: cursor-team-kit/skills/control-ui
    ref: ecc249f1e306fc64ddf83c7bed16cacf7c2239db
    alias: control-ui
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/cursor/plugins.git
    path: cursor-team-kit/skills/control-cli
    ref: ecc249f1e306fc64ddf83c7bed16cacf7c2239db
    alias: control-cli
    targets:
    - claude
    - codex
    - copilot

  # --- Japanese prose ---------------------------------------------------------
  # pstack's unslop is written against English tells. Replies here are in
  # Japanese, so this is the pass for them. Same pin as core-principal.
  - git: https://github.com/gonta223/humanizer-ja.git
    ref: a1e343696e43aa50e7218891f3319ab22cde3464
    alias: humanizer-ja
    targets:
    - claude
    - codex
    - copilot

  # --- Orca -------------------------------------------------------------------
  # Orca runs parallel work and supervision in this environment, so the vendor's
  # own skills replace pstack's Cursor cloud agents. Only the two that the
  # overlay routes to; same pin as core-principal.
  - git: https://github.com/stablyai/orca.git
    path: skills/orca-cli
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: orca-cli
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/stablyai/orca.git
    path: skills/orchestration
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: orchestration
    targets:
    - claude
    - codex
    - copilot

  # --- Taken from core-principal ---------------------------------------------
  # Published skills core-principal also depends on, none of which pstack has a
  # counterpart for (see the README's table). Same git, path and ref as
  # core-principal/apm.yml, so both harnesses run the same text; tests/check.sh
  # fails if they drift. Not a dependency on core-principal itself: apm cannot
  # take part of a package.
  #
  # cognitive-rhythm-writing reads ../japanese-tech-writing/SKILL.md, so those
  # two aliases stay exactly these names.
  - git: https://github.com/vercel-labs/skills.git
    path: skills/find-skills
    ref: 7407f3893ad4dceab546ac002c3ef806e4000c73
    alias: find-skills
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/humanlayer/skills.git
    path: plugins/show-me
    ref: ca7c8088db69e315a8b2deea43820270457f8f3c
    alias: show-me
    targets:
    - claude
    - codex
    - copilot

  - git: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d.git
    ref: 8f2d57610a73efc97d743c9b0b0ecb1002e09fa4
    alias: japanese-tech-writing
    targets:
    - claude
    - codex
    - copilot

  - git: https://gist.github.com/k16shikano/eb2929f13ed19c97188393d297be8432.git
    ref: a3b1e26beced71d582e13314fb6f5b179b023c76
    alias: cognitive-rhythm-writing
    targets:
    - claude
    - codex
    - copilot

  # Only the review, and only on architect's sketch (the overlay says when).
  # The ponytail norm itself was never opened under poteto-mode in the
  # comparison, and its reply and comment rules contradict pstack's; see
  # docs/ponytail.md.
  - git: https://github.com/dietrichgebert/ponytail.git
    path: skills/ponytail-review
    ref: e3ba2aa6f1e6f0bc4d69eb09c9f0d0a93af56156
    alias: ponytail-review
    targets:
    - claude

  # mattpocock/skills, productivity. `teach` is left out: pstack ships its own.
  - git: https://github.com/mattpocock/skills.git
    path: skills/productivity/grill-me
    ref: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
    alias: grill-me
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/mattpocock/skills.git
    path: skills/productivity/grilling
    ref: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
    alias: grilling
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/mattpocock/skills.git
    path: skills/productivity/to-questionnaire
    ref: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
    alias: to-questionnaire
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/mattpocock/skills.git
    path: skills/productivity/wait-what
    ref: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
    alias: wait-what
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/mattpocock/skills.git
    path: skills/productivity/writing-for-agents
    ref: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
    alias: writing-for-agents
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/mattpocock/skills.git
    path: skills/productivity/handoff
    ref: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
    alias: handoff
    targets:
    - claude
    - codex
    - copilot

  # The rest of Orca's own skills.
  - git: https://github.com/stablyai/orca.git
    path: skills/orca-emulator
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: orca-emulator
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/stablyai/orca.git
    path: skills/orca-emulator-android
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: orca-emulator-android
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/stablyai/orca.git
    path: skills/computer-use
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: computer-use
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/stablyai/orca.git
    path: skills/linear-tickets
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: linear-tickets
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/stablyai/orca.git
    path: skills/orca-linear
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: orca-linear
    targets:
    - claude
    - codex
    - copilot

  - git: https://github.com/stablyai/orca.git
    path: skills/orca-per-workspace-env
    ref: a445abadd4b2fd75d987872c0aa9d274f05ab33b
    alias: orca-per-workspace-env
    targets:
    - claude
    - codex
    - copilot

scripts: {}
