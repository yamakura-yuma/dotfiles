# PR のゲート。中身は justfile の `ci`（= `make ci`）で、再利用 workflow はそれを走らせるだけ。
# 型は docs/gates.md。`paths` で絞らない（飛ばされた必須チェックは Pending のままマージを止めるため）。
#
# `./.github/workflows/just-ci.yml` ではなく SHA 固定で呼ぶ（公式が最も安全とする形。docs/gates.md の「再利用 workflow の参照」）。
# just-ci.yml を変えたら、main に入れたあとで @ の SHA を上げる別 PR を出す。
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    uses: yamakura-yuma/dotfiles/.github/workflows/just-ci.yml@36b87604c93cc0ae5748b04327edc0c666b74fdc
