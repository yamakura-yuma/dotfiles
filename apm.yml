name: agent-environment
version: 1.0.0
description: Claude Code environment for this repo, authored as APM primitives
author: yyamakura
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
targets:
- claude
# Everything here is installed at *project* scope: `apm install` (no -g) in
# this checkout deploys .apm/ plus the dependency below into ./.claude/, and
# nothing into ~/.claude/. Host-wide pieces live in host-apm.yml instead.
#
# This repo is just the first consumer of ./makura-agents — it depends on that
# package the same way any other repo would, so whatever breaks for them breaks
# here too. What stays in ./.apm/ is only what is true of *this* repo and would
# be wrong anywhere else.
dependencies:
  apm:
  - path: ./makura-agents
    alias: makura-agents
scripts: {}
